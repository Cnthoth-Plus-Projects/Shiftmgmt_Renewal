<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근무 관리 시스템 — 시안 02-common-3.html</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>

:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --line: #E2E5EA;
  --line-strong: #848A93;
  --text: #1F2430;
  --text-sub: #4B5563;
  --accent: #3E56B6;
  --row-selected: #EEF1FB;
  --badge-approved-text: #1E7A46;
  --badge-approved-bg: #E8F5EE;
  --badge-pending-text: #4B5563;
  --badge-pending-bg: #F1F2F4;
  --badge-rejected-text: #C0392B;
  --badge-rejected-bg: #FCEBE9;
  --badge-reapproved-text: #A05200;
  --badge-reapproved-bg: #FDF3E4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
  background: #E5E7EB;
  color: var(--text);
  line-height: 1.5;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0;
  gap: 32px;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  width: 20px;
  height: 20px;
  overflow: hidden;
  user-select: none;
}
.icon-18 { font-size: 18px; width: 18px; height: 18px; }
.icon-40 { font-size: 40px; width: 40px; height: 40px; }
*:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.state-wrapper {
  display: flex;
  flex-direction: column;
  width: 1440px;
  background: #FFFFFF;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.status-label-bar {
  height: 36px;
  background: #E2E5EA;
  color: #4B5563;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  padding-left: 16px;
  border-bottom: 1px solid #D1D5DB;
}
.app-window {
  width: 1440px;
  height: 900px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}
.app-body {
  display: flex;
  flex: 1;
  height: calc(900px - 32px);
  overflow: hidden;
}
.sidebar {
  width: 220px;
  background: #FFFFFF;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.15s ease;
}
.sidebar.collapsed { width: 64px; }
.nav-list { list-style: none; padding: 8px 0; flex: 1; overflow-y: auto; }
.nav-group-header { padding: 12px 16px 4px; font-size: 12px; font-weight: 600; color: var(--text-sub); }
.sidebar.collapsed .nav-group-header { text-align: center; padding: 8px 0 4px; font-size: 12px; }
.nav-item {
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  color: var(--text);
  text-decoration: none;
  gap: 10px;
  font-size: 14px;
  position: relative;
  white-space: nowrap;
}
.sidebar.collapsed .nav-item { justify-content: center; padding: 0; gap: 0; }
.sidebar.collapsed .nav-item span:not(.material-symbols-outlined):not(.nav-dot-badge) { display: none; }
.nav-item:hover { background: #F8F9FA; }
.nav-item.active { background: #EEF1FB; color: var(--accent); font-weight: 600; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent);
}
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 12px;
  line-height: 1;
}
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 1220px;
  overflow: hidden;
  transition: width 0.15s ease;
}
.sidebar.collapsed + .main-wrapper {
  width: 1376px;
}
.header-bar {
  height: 56px;
  background: #FFFFFF;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 0 12px;
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 8px; }
.btn-sidebar-toggle {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text);
}
.btn-sidebar-toggle:hover { background: #F4F5F7; }
.header-divider { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.header-title { font-size: 20px; font-weight: 600; color: var(--text); white-space: nowrap; }
.header-user-actions { display: flex; align-items: center; gap: 12px; }
.role-badge {
  background: #EEF1FB;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid #D5DCF5;
}
.user-info-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-sub);
  font-size: 13px;
  text-decoration: none;
  background: none;
  border: none;
  cursor: pointer;
}
.page-content {
  flex: 1;
  padding: 16px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.footer-statusbar {
  height: 32px;
  background: #FFFFFF;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 12px;
  color: var(--text-sub);
  width: 1440px;
  box-sizing: border-box;
  flex-shrink: 0;
}
.status-cell {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border-right: 1px solid var(--line);
  height: 100%;
}
.status-cell:first-child { padding-left: 0; }
.status-cell:last-child { border-right: none; margin-left: auto; padding-right: 0; }
.status-dot-green { width: 8px; height: 8px; background: #1E7A46; border-radius: 50%; display: inline-block; }
.status-dot-red { width: 8px; height: 8px; background: #C0392B; border-radius: 50%; display: inline-block; }

.btn-primary {
  background: var(--accent);
  color: #FFFFFF;
  border: 1px solid var(--accent);
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary:hover { background: #32479B; }
.btn-secondary {
  background: #FFFFFF;
  color: var(--text);
  border: 1px solid var(--line-strong);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-secondary:hover { background: #F8F9FA; border-color: var(--line-strong); }
.btn-danger {
  background: #C0392B;
  color: #FFFFFF;
  border: 1px solid #C0392B;
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-danger:hover { background: #A93226; }
.btn-ghost {
  background: none;
  border: none;
  color: var(--text-sub);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}
.btn-ghost:hover { background: rgba(0,0,0,0.05); }
.btn-sm { padding: 4px 8px; font-size: 12px; }

[aria-disabled="true"], button:disabled {
  opacity: 0.5;
  cursor: not-allowed !important;
}

.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
.form-input, .form-select {
  height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  padding: 0 10px;
  font-size: 14px;
  background: #FFFFFF;
  color: var(--text);
}
.form-input:focus, .form-select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(62,86,182,0.15);
}
.disabled-desc {
  font-size: 12px;
  color: #C0392B;
  display: block;
}

.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-box {
  background: #FFFFFF;
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: 850px;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 14px;
}
.modal-footer {
  padding: 12px 20px;
  background: #F8F9FA;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.box-blue-info {
  background: #EEF1FB;
  border: 1px solid #C9D4F4;
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
}
.box-red-danger {
  background: #FCEBE9;
  border: 1px solid #E0B4B0;
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 13px;
  color: #C0392B;
  line-height: 1.4;
}

.table-data, .table-custom {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.table-data th, .table-data td, .table-custom th, .table-custom td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  height: 40px;
  min-height: 40px;
  box-sizing: border-box;
  text-align: left;
}
.table-data th, .table-custom th {
  background: #F8F9FA;
  font-weight: 600;
  color: var(--text-sub);
  font-size: 13px;
}
.table-data tbody tr:hover { background: #F8F9FA; cursor: pointer; }
.table-data tbody tr.selected { background: var(--row-selected); font-weight: 500; }

.filter-chip-group { display: flex; gap: 6px; align-items: center; }
.filter-chip {
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 500;
  background: #FFFFFF;
  border: 1px solid var(--line);
  color: var(--text-sub);
  cursor: pointer;
}
.filter-chip.active {
  background: #EEF1FB;
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.badge-approved { background: var(--badge-approved-bg); color: var(--badge-approved-text); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.badge-pending { background: var(--badge-pending-bg); color: var(--badge-pending-text); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.badge-info { background: #EEF1FB; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }

.empty-state-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: 8px;
  width: 600px;
  gap: 16px;
  margin: 40px auto;
}
.empty-illustration {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: #EEF1FB;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.demo-caption {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.4;
}

.common-stage {
  width: 1440px;
  height: 900px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;

.common-content-box {

  border: 1px solid var(--line);

  display: flex;
  flex-direction: column;

  gap: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.skeleton-table-row {
  height: 40px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
}
</style>
</head>
